name: Deploy

# Quality gate + deploy. `check` (lint, typecheck, tests) runs on every push
# to `stage` and on pull requests. `deploy` builds the site and publishes it
# to the gh-pages branch, but only after `check` passes and only on `stage`
# pushes — so no manual `pnpm release` is needed. Can also be run by hand
# from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [stage]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec gh-pages \
            --dist dist \
            --user "GitHub Actions <github-actions@users.noreply.github.com>" \
            --message "deploy: ${GITHUB_SHA}" \
            --repo "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
