name: Deploy

# Quality gate + deploy. `check` (lint, typecheck, tests) runs on every push
# to `stage`, on pull requests and on manual runs. `deploy` builds the site
# and publishes it to the gh-pages branch, but only after `check` passes and
# only from the `stage` branch — a `stage` push does it automatically, and a
# manual run from the Actions tab (workflow_dispatch) only deploys when
# `stage` is the selected branch; any other branch just runs the checks.
# No manual `pnpm release` is needed.
on:
  push:
    branches: [stage]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    # A newer push to the same ref makes the running checks obsolete.
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest
    # Never cancel a publish half-way through its gh-pages push; queue deploys
    # instead so each one lands completely and in order.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec gh-pages \
            --dist dist \
            --user "GitHub Actions <github-actions@users.noreply.github.com>" \
            --message "deploy: ${GITHUB_SHA}" \
            --repo "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
