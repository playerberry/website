    <script>
      // GitHub Pages SPA fallback: restore the deep link captured by 404.html
      // before the router boots. Storage access can throw (strict privacy
      // modes); a failure simply leaves the visitor on the home page.
      (function () {
        var redirect = null;
        try {
          redirect = sessionStorage.getItem("pb:redirect");
          sessionStorage.removeItem("pb:redirect");
        } catch (e) {}
        if (redirect && redirect !== location.pathname + location.search + location.hash) {
          history.replaceState(null, "", redirect);
        }
      })();
    </script>
