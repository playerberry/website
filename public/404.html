<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/playerberry.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a10" />
    <title>PlayerBerry — 404</title>
    <meta name="robots" content="noindex" />
    <script>
      // GitHub Pages SPA fallback: remember the requested URL and let the
      // app router restore it (see the matching snippet in index.html).
      // Storage access can throw (strict privacy modes); still go home.
      try {
        sessionStorage.setItem("pb:redirect", location.pathname + location.search + location.hash);
      } catch (e) {}
      location.replace("/");
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-family: "JetBrains Mono", "Roboto Mono", monospace;
        height: 100vh;
        background-color: #0a0a10;
        color: #f2f2f7;
      }
      h1 {
        font-size: 4em;
        margin: 0 0 16px;
        background: linear-gradient(135deg, #ff3d77, #8b5cf6);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p {
        color: #9a9aab;
      }
      a {
        color: #ff3d77;
        text-decoration: none;
        transition: color 0.3s ease;
      }
      a:hover {
        color: #3cf0c5;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>404</h1>
      <p id="pb-404-text">Ulaşmaya çalıştığınız sayfa artık yok ya da hiç var olmadı.</p>
      <a id="pb-404-link" href="https://playerberry.com">Dön bebeğim.</a>
    </div>
    <script>
      // Localize the brief fallback copy for non-Turkish browsers. (The page
      // normally redirects instantly; this only matters if the redirect fails.)
      if (navigator.language && navigator.language.toLowerCase().indexOf("tr") !== 0) {
        document.documentElement.lang = "en";
        document.getElementById("pb-404-text").textContent =
          "The page you are looking for no longer exists — or never did.";
        document.getElementById("pb-404-link").textContent = "Take me home.";
      }
    </script>
  </body>
</html>
